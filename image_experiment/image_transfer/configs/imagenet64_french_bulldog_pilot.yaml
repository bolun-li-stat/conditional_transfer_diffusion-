dataset: imagenet64
study_stage: case_study
data_root: ${DATA_ROOT}
output_root: ${RESULTS_ROOT:-image_transfer_results}
image_size: 64
analysis_plan_path: analysis_plan.yaml
environment_lock_path: ../../environment/image-transfer-cuda.yml
exact_environment_lock_path: ${EXACT_ENVIRONMENT_LOCK_PATH:-}
environment_runtime_report_path: ${ENVIRONMENT_RUNTIME_REPORT_PATH:-}
gpu_runtime_probe_path: ${GPU_RUNTIME_PROBE_PATH:-}
resume_probe_path: ${RESUME_PROBE_PATH:-}
dataset_identity_path: ${DATASET_IDENTITY_PATH:-}
targets:
  - name: French bulldog
    synset: n02108915
    auxiliary_sets:
      close: [n02096585, n02110958, n02108089, n02085620, n02091032, n02099601]
      medium: [n02123045, n02123159, n02124075, n02119022, n02114367]
      far: [n03594945, n04146614, n03028079, n03457902, n03710193]
K_aux_values: [5]
m_per_aux_rule: equal_n0
seed_design:
  holdout_seed: 0
  training_subset_seeds: [0]
  optimization_seed_pairs:
    - {model_initialization_seed: 0, training_seed: 0}
    - {model_initialization_seed: 1, training_seed: 1}
    - {model_initialization_seed: 2, training_seed: 2}
  sampling_seed: 1000
  evaluation_seed: 2000
training_protocols: [natural_compute_matched]
data_split:
  manifest_root: ${RESULTS_ROOT:-image_transfer_results}/manifests
  holdout_seed: 0
  training_subset_seed: 0
  target_eval_size: 500
  target_val_size: 100
  auxiliary_eval_size: 100
  target_similarity_reference_size: 100
  auxiliary_similarity_reference_size: 100
  nested_training_subsets: true
  eval_source: train_holdout
  insufficient_data_action: skip
model: {architecture: adm_unet, profile: pilot_small}
diffusion: {timesteps: 1000, schedule: cosine, prediction_type: epsilon, reverse_variance: fixed}
optimizer: {name: adamw, lr: 0.0002, betas: [0.9, 0.999], eps: 1.0e-8, weight_decay: 0.0}
training: {steps: 100000, batch_size: 64, num_workers: 0, precision: amp, validation_interval: 1000, ema_decay: 0.9999, max_grad_norm: 1.0, minimum_gpu_headroom_bytes: 2147483648}
sampling: {sampler: ddpm, steps: 1000, batch_size: 64, ddim_eta: 0.0}
num_generated: 5000
experiments:
  A: {enabled: true, n0_values: [50, 100], aux_sets: [close, medium, far, mix]}
  B: {enabled: false, n0_values: [50, 100], aux_sets: [close, medium, far, mix], skip_if_insufficient_target_images: true}
  C: {enabled: false, n0_values: [100], compositions: [close_only, mostly_close, balanced_mix, mostly_far, far_only]}

evaluation:
  mode: strict
  corruption_bank_root: ${RESULTS_ROOT:-image_transfer_results}/corruption_banks
  validation_corruptions_per_image: 2
  test_corruptions_per_image: 2
  train_diagnostic_corruptions_per_image: 2
  train_diagnostic_max_images: 128
  compute_fid: true
  compute_kid: true
  compute_prdc: true
  compute_classifier_fidelity: true
  compute_inception_score: false
  compute_cmmd: false
  compute_feature_similarity: true
  make_nearest_neighbors: true
  real_eval_max: 500
  sampling_batch_size: 64
  classifier_batch_size: 64
  nn_batch_size: 64
  fid_batch_size: 64
  feature_batch_size: 64
  kid_subset_size: 100
  kid_num_subsets: 100
  prdc_k: 5
