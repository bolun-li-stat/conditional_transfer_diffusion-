    selection_rationale: >-
      The close dog breeds provide the endpoint most favorable to positive
      transfer. Medium preserves quadruped-mammal or carnivore structure while
      moving beyond fine-grained dog breeds. Far uses human-made objects with
      clearly different semantics and visual structure as an extreme mismatch.
      The close and far endpoints are run; medium is frozen for future study but
      is not run in the reduced primary-protocol grid.
