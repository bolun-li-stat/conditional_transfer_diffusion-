# Deprecated compatibility alias. Use cifar10_fake_smoke.yaml; FakeData output
# is pipeline validation only and must never be reported as an experiment.
dataset: cifar10
study_stage: smoke
use_fake_data: true
data_root: ${DATA_ROOT:-data}
output_root: ${RESULTS_ROOT:-image_transfer_results}
image_size: 32
targets:
  - name: dog
    synset: dog
    auxiliary_sets:
      close: [cat, horse, deer, bird, frog]
      medium: [automobile, truck, ship, airplane, cat]
      far: [automobile, truck, ship, airplane, frog]
  - name: automobile
    synset: automobile
    auxiliary_sets:
      close: [truck, ship, airplane, dog, cat]
      medium: [ship, airplane, horse, deer, bird]
      far: [dog, cat, horse, deer, frog]
n0_values: [100, 250, 500]
K_aux_values: [5]
m_per_aux_rule: equal_n0
seed_design:
  holdout_seed: 0
  training_subset_seeds: [0]
  optimization_seed_pairs:
    - {model_initialization_seed: 0, training_seed: 0}
  sampling_seed: 1000
  evaluation_seed: 2000
model: {architecture: adm_unet, profile: smoke_tiny}
diffusion: {timesteps: 10, schedule: linear, prediction_type: epsilon, reverse_variance: fixed}
optimizer: {name: adamw, lr: 0.001, betas: [0.9, 0.999], eps: 1.0e-8, weight_decay: 0.0}
training: {steps: 2, batch_size: 4, num_workers: 0, precision: fp32, validation_interval: 1, ema_decay: 0.999, max_grad_norm: 1.0}
sampling: {sampler: ddim, steps: 2, batch_size: 4, ddim_eta: 0.0}
num_generated: 4
experiments:
  A: {enabled: true, n0_values: [100, 250, 500], aux_sets: [close, medium, far, mix]}
  B: {enabled: false, n0_values: [100], aux_sets: [close, medium, far, mix], skip_if_insufficient_target_images: true}
  C: {enabled: false, n0_values: [100], compositions: [close_only, mostly_close, balanced_mix, mostly_far, far_only]}

evaluation:
  mode: debug
  compute_fid: false
  compute_kid: false
  compute_classifier_fidelity: false
  make_nearest_neighbors: false
