  endpoints: [test_epsilon_mse_target, kid_target_mean]
secondary:
  comparisons: [conditional_mix_vs_conditional_target_only]
  endpoints:
    - fid_target
    - classifier_target_top1_acc
    - auxiliary_leakage_rate
    - density_target
    - coverage_target
