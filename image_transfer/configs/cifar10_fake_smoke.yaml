# Offline-only pipeline validation. These synthetic images are not experiment results.
dataset: cifar10
study_stage: smoke
use_fake_data: true
fake_data_size: 512
data_root: ${DATA_ROOT:-data}
output_root: ${RESULTS_ROOT:-image_transfer_results_fake_smoke}
image_size: 8

targets:
  - name: dog
    synset: dog
    auxiliary_sets:
      close: [cat, horse, deer, bird, frog]
      medium: [automobile, truck, ship, airplane, cat]
      far: [automobile, truck, ship, airplane, frog]

data_split:
  manifest_root: ${RESULTS_ROOT:-image_transfer_results_fake_smoke}/manifests
  holdout_seed: 0
  training_subset_seed: 0
  target_eval_size: 16
  target_val_size: 8
  nested_training_subsets: true
  eval_source: train_holdout
  insufficient_data_action: fail

seed_design:
  holdout_seed: 0
  training_subset_seeds: [0]
  optimization_seed_pairs:
    - {model_initialization_seed: 0, training_seed: 0}
  sampling_seed: 1000
  evaluation_seed: 2000
training_protocols: [natural_compute_matched]
n0_values: [8]
K_aux_values: [2]
m_per_aux_rule: equal_n0
num_aux_set_draws: 1
aux_draw_seed: 3000

model:
  architecture: adm_unet
  profile: smoke_tiny
diffusion:
  timesteps: 4
  schedule: linear
  prediction_type: epsilon
  reverse_variance: fixed
optimizer:
  name: adamw
  lr: 0.001
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0
training:
  protocol: natural_compute_matched
  steps: 2
  batch_size: 4
  target_batch_size: 4
  auxiliary_batch_size: 4
  auxiliary_loss_weight: 1.0
  num_workers: 0
  precision: fp32
  ema_decay: 0.999
  max_grad_norm: 1.0
  validation_interval: 1
  checkpoint_interval: 1
sampling:
  sampler: ddpm
  steps: 4
  batch_size: 4
  ddim_eta: 0.0
num_generated: 8

experiments:
  A:
    enabled: true
    n0_values: [8]
    aux_sets: [close]
  B:
    enabled: true
    n0_values: [8]
    aux_sets: [close]
    skip_if_insufficient_target_images: true
  C:
    enabled: true
    n0_values: [8]
    compositions: [close_only, far_only]

evaluation:
  mode: debug
  corruption_bank_root: ${RESULTS_ROOT:-image_transfer_results_fake_smoke}/corruption_banks
  validation_corruptions_per_image: 1
  test_corruptions_per_image: 1
  train_diagnostic_corruptions_per_image: 1
  train_diagnostic_max_images: 16
  noise_bins:
    low: [0.0, 0.25]
    mid: [0.25, 0.75]
    high: [0.75, 1.0]
  compute_fid: false
  compute_kid: false
  compute_prdc: false
  compute_classifier_fidelity: false
  classifier_unavailable_reason: CIFAR-10 classifier is intentionally disabled in the offline smoke test
  compute_inception_score: false
  compute_cmmd: false
  compute_feature_similarity: false
  make_nearest_neighbors: false
  real_eval_max: 16
  sampling_batch_size: 4
  feature_batch_size: 4
  fid_batch_size: 4
  kid_subset_size: 4
  kid_num_subsets: 2
  prdc_k: 3
