# Real-data GPU engineering check only; outputs are not scientific results.
dataset: imagenet64
study_stage: pilot
use_fake_data: false
data_root: ${DATA_ROOT}
output_root: ${RESULTS_ROOT:-image_transfer_results_gpu_smoke}
image_size: 64
target_set_path: targets/french_bulldog_pilot.yaml
analysis_plan_path: analysis_plan.yaml
environment_lock_path: ../../environment/image-transfer-cuda.yml
metric_assets_manifest_path: ${METRIC_ASSETS_MANIFEST:-}
include_legacy_unconditional: false

data_split:
  manifest_root: ${RESULTS_ROOT:-image_transfer_results_gpu_smoke}/manifests
  holdout_seed: 100
  training_subset_seed: 0
  target_eval_size: 500
  target_val_size: 100
  auxiliary_eval_size: 100
  nested_training_subsets: true
  eval_source: train_holdout
  insufficient_data_action: fail
seed_design:
  holdout_seed: 100
  training_subset_seeds: [0]
  optimization_seed_pairs:
    - {model_initialization_seed: 0, training_seed: 0}
  sampling_seed: 1000
  evaluation_seed: 2000

model: {architecture: adm_unet, profile: main_default}
diffusion: {timesteps: 1000, schedule: cosine, prediction_type: epsilon, reverse_variance: fixed}
optimizer: {name: adamw, lr: 0.0002, betas: [0.9, 0.999], eps: 1.0e-8, weight_decay: 0.0}
training:
  protocol: natural_compute_matched
  steps: 100
  batch_size: 16
  target_batch_size: 16
  auxiliary_batch_size: 16
  auxiliary_loss_weight: 1.0
  num_workers: 0
  precision: amp
  ema_decay: 0.9999
  max_grad_norm: 1.0
  validation_interval: 50
  checkpoint_interval: 50
sampling: {sampler: ddim, steps: 20, batch_size: 16, ddim_eta: 0.0, guidance_scale: 1.0}
num_generated: 32
n0_values: [100]
K_aux_values: [3]
auxiliary_ratio_values: [1.0]
training_protocols: [natural_compute_matched]
num_aux_set_draws: 1
aux_draw_seed: 3000
experiments:
  A:
    enabled: true
    n0_values: [100]
    aux_sets: [close, far]
    include_legacy_unconditional: false
  B: {enabled: false}
  C: {enabled: false}
evaluation:
  mode: strict
  corruption_bank_root: ${RESULTS_ROOT:-image_transfer_results_gpu_smoke}/corruption_banks
  validation_corruptions_per_image: 2
  test_corruptions_per_image: 2
  train_diagnostic_corruptions_per_image: 2
  train_diagnostic_max_images: 32
  compute_fid: true
  compute_kid: true
  compute_prdc: true
  compute_classifier_fidelity: true
  compute_inception_score: false
  compute_cmmd: false
  compute_feature_similarity: true
  make_nearest_neighbors: true
  real_eval_max: 500
  fid_reliable_min_real: 1000
  near_duplicate_calibration_quantile: 0.01
  near_duplicate_calibration_max_images: 256
