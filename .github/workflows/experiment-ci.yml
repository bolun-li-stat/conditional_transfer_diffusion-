name: experiment-ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gmm-spectrum-rotation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gmm_simulation/spectrum_matched_rotation_experiment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gmm_simulation/spectrum_matched_rotation_experiment/requirements.txt
      - name: Install spectrum-rotation CPU dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q . ../original_ar1_experiment
      - name: Spectrum rotation and relocation tests
        run: python -m pytest -q

  image-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: image_experiment
    env:
      PYTHONPATH: .
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: image_experiment/environment/requirements-image-lock.txt
      - name: Configure temporary paths
        run: |
          echo "TORCH_HOME=$RUNNER_TEMP/empty-torch-cache" >> "$GITHUB_ENV"
          echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib" >> "$GITHUB_ENV"
          echo "RESULTS_ROOT=$RUNNER_TEMP/image-transfer-results" >> "$GITHUB_ENV"
      - name: Install exact CPU environment
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r environment/requirements-image-lock.txt
      - name: Compile
        run: python -m compileall -q image_transfer tests
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: V2 unequal-seed integration regression
        run: >-
          python -m pytest -q
          tests/test_image_transfer.py::test_v2_unequal_holdout_and_subset_seeds_run_grid_to_result
      - name: Validate FakeData job and preflight
        run: |
          python -m image_transfer.scripts.make_job_grid \
            --experiment A \
            --config image_transfer/configs/cifar10_fake_smoke.yaml \
            --out "${RUNNER_TEMP}/smoke_jobs.csv" \
            --max-jobs 20
          python -m image_transfer.scripts.preflight_experiment \
            --config image_transfer/configs/cifar10_fake_smoke.yaml \
            --out-dir "${RUNNER_TEMP}/preflight"
          python -m image_transfer.scripts.run_job \
            --jobs-csv "${RUNNER_TEMP}/smoke_jobs.csv" \
            --job-index 0 \
            --device cpu \
            --force
      - name: Validate unresolved release grid shape
        run: |
          python -m image_transfer.scripts.make_job_grid \
            --experiment A \
            --config image_transfer/configs/imagenet64_release_pilot.yaml \
            --out "${RUNNER_TEMP}/release_jobs.csv" \
            --max-jobs 20
          python -c "import csv; rows=list(csv.DictReader(open('${RUNNER_TEMP}/release_jobs.csv'))); assert len(rows)==12; assert {row['runnable'] for row in rows}=={'False'}; assert {row['dataset_identity_status'] for row in rows}=={'unresolved_strict'}; assert {row['exact_environment_lock_status'] for row in rows}=={'unresolved_strict'}"
