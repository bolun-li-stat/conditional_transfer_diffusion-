name: image-transfer-ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Configure temporary paths
        run: |
          echo "TORCH_HOME=$RUNNER_TEMP/empty-torch-cache" >> "$GITHUB_ENV"
          echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib" >> "$GITHUB_ENV"
          echo "RESULTS_ROOT=$RUNNER_TEMP/image-transfer-results" >> "$GITHUB_ENV"
      - name: Install exact CPU environment
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r environment/requirements-image-lock.txt
      - name: Compile
        run: python -m compileall -q image_transfer tests
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Validate smoke job grid
        run: |
          python -m image_transfer.scripts.make_job_grid \
            --experiment A \
            --config image_transfer/configs/cifar10_fake_smoke.yaml \
            --out "${RUNNER_TEMP}/smoke_jobs.csv" \
            --max-jobs 20
      - name: Validate resolved model and preflight
        run: |
          python -m image_transfer.scripts.inspect_model \
            --config image_transfer/configs/cifar10_fake_smoke.yaml \
            --out "${RUNNER_TEMP}/model_audit.json"
          python -m image_transfer.scripts.preflight_experiment \
            --config image_transfer/configs/cifar10_fake_smoke.yaml \
            --out-dir "${RUNNER_TEMP}/preflight"
      - name: Validate release grid shape without data access
        run: |
          python -m image_transfer.scripts.make_job_grid \
            --experiment A \
            --config image_transfer/configs/imagenet64_release_pilot.yaml \
            --out "${RUNNER_TEMP}/release_jobs.csv" \
            --max-jobs 20
      - name: Gaussian regression
        run: |
          python train.py \
            --experiment smoke \
            --results-dir "${RUNNER_TEMP}/gaussian_smoke" \
            --device cpu \
            --training-steps 1 \
            --n-generated 4 \
            --score-risk-mc-samples 4 \
            --seeds 0 \
            --force
